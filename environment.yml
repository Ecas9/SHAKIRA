# environment.yml - one conda env that replaces ALL the `module load` tools for the
# host side of the pipeline (ingest -> QC -> harmonize -> plink -> ADMIXTURE -> R analysis).
# This is the "get off modules" env: `conda env create -f environment.yml && conda activate shakira`.
#
# Nextflow/nf-core (rnavar / sarek launcher) live in envs/nextflow.yaml on purpose - the JVM
# stack is heavy and only the upstream variant-calling step needs it. STAR/GATK/samtools for
# that step run INSIDE the nf-core Singularity containers, not from this env.
#
# For Snakemake, prefer the per-rule envs in envs/*.yaml (smaller, cached per rule). This
# combined env is the convenience/standalone equivalent. Versions are pinned; see TOOLS_VERSIONS.txt.
name: shakira
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - snakemake-minimal=8.25.5
  - snakemake-executor-plugin-slurm=0.11.2   # cluster execution (profiles/slurm)
  # --- variant wrangling / QC ---
  - bcftools=1.21
  - samtools=1.21
  - htslib=1.21          # tabix + bgzip
  - bedtools=2.31.1      # used by the K3 high-quality-reference scripts
  - gnu-parallel=20240722 # standalone Stage-1 fan-out (Snakemake scatter replaces this)
  # --- PLINK stack ---
  - plink=1.90b6.21      # was module PLINK/1.90-foss-2016a
  - plink2=2.00a5.10
  # --- ADMIXTURE ---
  - admixture=1.3.0
  # --- reference prep (sequence dictionary for GATK-style refs) ---
  - gatk4=4.5.0.0
  # --- R analysis (was module R/4.2.0-foss-2022b) ---
  - r-base=4.2.3
  - r-tidyverse=2.0.0    # readr, dplyr, tidyr, stringr, ggplot2, tibble
  - pandoc=3.1.11        # was the `pandoc` conda env used for R report rendering
  # --- python sample-sheet builder (map_srr_to_ancestry.py) ---
  - pandas=2.2.2
